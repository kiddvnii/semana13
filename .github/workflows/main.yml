name: Validar y simular  deploy

on:
  push:
     branches: ["main"]
permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar repositorio
        uses: actions/checkout@v4

      - name: "Paso 1 Estrucutura de carpeta"
        run: |
          test -d app
          test -f app/index.php
          test -f Dockerfile
          test -f docker-compose.yml
  
